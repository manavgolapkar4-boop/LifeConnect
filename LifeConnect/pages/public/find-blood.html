<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Find Blood — LifeConnect</title>

  <meta
    name="description"
    content="Search nearby blood donors by blood group, location, distance and availability."
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <!-- LifeConnect CSS -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">

</head>


<body>

  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>


  <!-- Navbar -->
  <div id="lc-navbar-root"></div>


  <!-- ============================= -->
  <!-- MAIN CONTENT -->
  <!-- ============================= -->

  <main id="main-content">

    <!-- Page Hero -->
    <div class="page-hero-strip">

      <div class="container-lc">

        <h1>
          Find blood near you
        </h1>

        <p class="text-muted-lc mb-0">
          Search donors by blood group, location and availability.
        </p>

      </div>

    </div>


    <!-- Search Section -->
    <section style="padding-top:var(--space-6);">

      <div class="container-lc">

        <div class="row gy-4">


          <!-- ============================= -->
          <!-- FILTER PANEL -->
          <!-- ============================= -->

          <div class="col-lg-3">

            <form
              class="filter-panel-lc"
              id="filterForm"
            >

              <h4 class="mb-4">
                Filters
              </h4>


              <!-- Blood Group -->
              <div class="mb-3">

                <label
                  class="form-label-lc"
                  for="fBloodGroup"
                >
                  Blood group
                </label>

                <select
                  class="form-select-lc"
                  id="fBloodGroup"
                >

                  <option value="">
                    Any blood group
                  </option>

                </select>

              </div>


              <!-- Location -->
              <div class="mb-3">

                <label
                  class="form-label-lc"
                  for="fLocation"
                >
                  Location
                </label>

                <input
                  type="text"
                  class="form-control-lc"
                  id="fLocation"
                  placeholder="Area or city"
                >
              </div>

              </div>


              <!-- Availability -->
              <div class="mb-3">

                <label
                  class="form-label-lc"
                  for="fAvailability"
                >
                  Availability
                </label>

                <select
                  class="form-select-lc"
                  id="fAvailability"
                >

                  <option value="">
                    All donors
                  </option>

                  <option value="available">
                    Available now
                  </option>

                </select>

              </div>


              <!-- Emergency -->
              <div class="form-check mb-4">

                <input
                  class="form-check-input"
                  type="checkbox"
                  id="fEmergency"
                >

                <label
                  class="form-check-label"
                  for="fEmergency"
                  style="font-size:var(--fs-sm);"
                >
                  Emergency-availability only
                </label>

              </div>


              <!-- Search -->
              <button
                type="submit"
                class="btn-lc btn-primary-lc btn-block-lc"
              >

                <i class="bi bi-search"></i>

                Search

              </button>

            </form>

          </div>


          <!-- ============================= -->
          <!-- RESULTS -->
          <!-- ============================= -->

          <div class="col-lg-9">

            <!-- Results Header -->
            <div
              class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"
            >

              <span
                class="text-muted-lc"
                id="resultsCount"
              >
                Loading donors…
              </span>


              <!-- Sort -->
              <div class="d-flex align-items-center gap-2">

                <label
                  class="form-label-lc mb-0"
                  for="sortBy"
                  style="white-space:nowrap;"
                >
                  Sort by
                </label>

                <select
                  class="form-select-lc"
                  id="sortBy"
                  style="width:auto;"
                >

                  <option value="match">
                    Best Match
                  </option>

                  <option value="nearest">
                    Nearest
                  </option>

                  <option value="available">
                    Available First
                  </option>

                </select>

              </div>

            </div>


            <!-- Donor Results -->
            <div
              class="row gy-4"
              id="donorResults"
            ></div>


            <!-- Empty State -->
            <div
              id="emptyState"
              class="empty-state-lc d-none"
            >

              <div class="empty-icon-lc">

                <i class="bi bi-emoji-frown"></i>

              </div>

              <h4>
                No matching donors found in this area.
              </h4>

              <p class="mb-0">
                Try widening your distance filter or removing
                the blood group filter.
              </p>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ============================= -->
  <!-- DONOR PROFILE MODAL -->
  <!-- ============================= -->

  <div
    class="modal fade"
    id="donorModal"
    tabindex="-1"
    aria-labelledby="donorModalLabel"
    aria-hidden="true"
  >

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">


        <!-- Modal Header -->
        <div class="modal-header">

          <h5
            class="modal-title"
            id="donorModalLabel"
          >
            Donor profile
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>

        </div>


        <!-- Modal Body -->
        <div
          class="modal-body"
          id="donorModalBody"
        ></div>


        <!-- Modal Footer -->
        <div class="modal-footer">

          <button
            type="button"
            class="btn-lc btn-outline-lc"
            data-bs-dismiss="modal"
          >
            Close
          </button>

          <button
            type="button"
            class="btn-lc btn-primary-lc"
            id="donorModalSendRequest"
          >

            <i class="bi bi-send"></i>

            Send Request

          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- ============================= -->
  <!-- BLOOD REQUEST MODAL -->
  <!-- ============================= -->

  <div
    class="modal fade"
    id="requestModal"
    tabindex="-1"
    aria-labelledby="requestModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <div>
            <h5 class="modal-title" id="requestModalLabel">
              Request Blood
            </h5>
            <small class="text-muted" id="requestDonorInfo"></small>
          </div>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <form id="bloodRequestForm">
          <div class="modal-body">

            <div class="mb-3">
              <label class="form-label-lc" for="requesterName">
                Your Name
              </label>
              <input
                type="text"
                class="form-control-lc"
                id="requesterName"
                placeholder="Enter your name"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label-lc" for="requestBloodGroup">
                Blood Group
              </label>
              <input
                type="text"
                class="form-control-lc"
                id="requestBloodGroup"
                readonly
              >
            </div>

            <div class="mb-3">
              <label class="form-label-lc" for="requestUnits">
                Units Required
              </label>
              <input
                type="number"
                class="form-control-lc"
                id="requestUnits"
                min="1"
                max="10"
                value="1"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label-lc" for="requestHospital">
                Hospital
              </label>
              <input
                type="text"
                class="form-control-lc"
                id="requestHospital"
                placeholder="Enter hospital name"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label-lc" for="requestCity">
                City
              </label>
              <input
                type="text"
                class="form-control-lc"
                id="requestCity"
                placeholder="Enter your city"
                required
              >
            </div>

            <div class="mb-2">
              <label class="form-label-lc" for="requestUrgency">
                Urgency
              </label>
              <select
                class="form-select-lc"
                id="requestUrgency"
                required
              >
                <option value="Normal">Normal</option>
                <option value="Emergency">Emergency</option>
              </select>
            </div>

          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn-lc btn-outline-lc"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn-lc btn-primary-lc"
              id="submitBloodRequest"
            >
              <i class="bi bi-send"></i>
              Send Blood Request
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="lc-footer-root"></div>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- LifeConnect JS -->
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>


  <script>

    /* ==========================================
       NAVIGATION
    ========================================== */

    LCNav.mount({
      base: "../../",
      active: "find-blood"
    });



    /* ==========================================
       BLOOD GROUP DROPDOWN
    ========================================== */

    const bloodGroupSelect =
      document.getElementById("fBloodGroup");


    LCData.getBloodGroups().forEach(bg => {

      const option =
        document.createElement("option");

      option.value = bg;

      option.textContent = bg;

      bloodGroupSelect.appendChild(option);

    });



    /* ==========================================
       QUERY STRING
    ========================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    if (params.get("group")) {

      bloodGroupSelect.value =
        params.get("group");

    }



    /* ==========================================
       DOM ELEMENTS
    ========================================== */

    const donorResultsEl =
      document.getElementById(
        "donorResults"
      );


    const emptyStateEl =
      document.getElementById(
        "emptyState"
      );


    const resultsCountEl =
      document.getElementById(
        "resultsCount"
      );



    /* ==========================================
       INITIALS
    ========================================== */

    function initials(name) {

      if (!name) {
        return "?";
      }


      return name
        .split(" ")
        .map(part => part[0])
        .slice(0, 2)
        .join("")
        .toUpperCase();

    }



    /* ==========================================
       RENDER DONORS
    ========================================== */

    function renderDonors(donors) {

      /* No donors */

      if (!donors.length) {

        donorResultsEl.innerHTML = "";

        emptyStateEl.classList.remove(
          "d-none"
        );

        resultsCountEl.textContent =
          "0 donors found";

        return;

      }


      /* Hide empty state */

      emptyStateEl.classList.add(
        "d-none"
      );


      /* Result count */

      resultsCountEl.textContent =
        `${donors.length} donor${donors.length > 1 ? "s" : ""} found`;



      /* Donor cards */

      donorResultsEl.innerHTML =
        donors.map(donor => `

          <div class="col-md-6 col-xl-4">

            <div class="card-lc card-lc-hover donor-card-lc h-100">


              <!-- Donor Header -->

              <div class="donor-card-head">

                <div class="d-flex gap-3">


                  <!-- Avatar -->

                  <span class="donor-avatar-lc">
                    ${initials(donor.name)}
                  </span>


                  <!-- Name and Location -->

                  <div>

                    <h4
                      style="font-size:var(--fs-md);"
                    >
                      ${donor.name}
                    </h4>


                    <div class="donor-card-meta">

                      ${donor.area || "Area not available"},
                      ${donor.city || "City not available"}

                    </div>

                  </div>

                </div>


                <!-- Blood Group -->

                <span class="badge-lc badge-blood-lc">

                  ${donor.bloodGroup}

                </span>

              </div>



              <!-- Availability -->

              <div class="d-flex flex-wrap gap-2">


                ${
                  donor.available

                    ? `

                      <span
                        class="badge-lc badge-success-lc"
                      >

                        <span
                          class="badge-dot-lc"
                        ></span>

                        Available

                      </span>

                    `

                    : `

                      <span
                        class="badge-lc badge-inactive-lc"
                      >

                        Unavailable

                      </span>

                    `
                }



                ${
                  donor.emergencyAvailable

                    ? `

                      <span
                        class="badge-lc badge-danger-lc"
                      >

                        <i
                          class="bi bi-lightning-charge-fill"
                        ></i>

                        Emergency ready

                      </span>

                    `

                    : ""
                }

              </div>



              <!-- Donor Actions -->

              <div class="donor-card-actions">


                <button
                  class="btn-lc btn-outline-lc btn-sm-lc flex-fill"
                  data-view-donor="${donor.id}"
                >

                  View Profile

                </button>


                <button
                  class="btn-lc btn-primary-lc btn-sm-lc flex-fill"
                  data-send-request="${donor.id}"
                >

                  Send Request

                </button>


              </div>

            </div>

          </div>

        `).join("");



      /* View Profile */

      donorResultsEl
        .querySelectorAll(
          "[data-view-donor]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              openDonorModal(
                button.dataset.viewDonor
              );

            }
          );

        });



      /* Send Request */

      donorResultsEl
        .querySelectorAll(
          "[data-send-request]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              openRequestForm(
                button.dataset.sendRequest
              );

            }
          );

        });

    }



    /* ==========================================
       SORT DONORS
    ========================================== */

    function sortDonors(
      donors,
      mode
    ) {

      const sortedDonors =
        donors.slice();


      /* Available first */

      if (mode === "available") {

        sortedDonors.sort(
          (a, b) =>
            Number(b.available) -
            Number(a.available)
        );

      }


      /* Nearest */

      else if (mode === "nearest") {

        sortedDonors.sort(
          (a, b) =>
            Number(a.distanceKm ?? 999999) -
            Number(b.distanceKm ?? 999999)
        );

      }


      /* Best match */

      else {

        sortedDonors.sort(
          (a, b) =>
            Number(b.matchScore ?? 0) -
            Number(a.matchScore ?? 0)
        );

      }


      return sortedDonors;

    }



    /* ==========================================
       GET DONORS FROM FASTAPI
    ========================================== */

    async function runSearch() {

      /* Filter values */

      const bloodGroup =
        bloodGroupSelect.value;


      const location =
        document
          .getElementById("fLocation")
          .value
          .trim()
          .toLowerCase();


      const availability =
        document
          .getElementById("fAvailability")
          .value;


      const emergencyOnly =
        document
          .getElementById("fEmergency")
          .checked;



      try {

        /* Call FastAPI */

        const response =
          await fetch(
            "http://127.0.0.1:8000/api/donors/"
          );


        /* Check response */

        if (!response.ok) {

          throw new Error(
            "Failed to fetch donors"
          );

        }


        /* JSON */

        const data =
          await response.json();


        /* Donors */

        let donors =
          data.donors || [];



        /* ======================================
           BLOOD GROUP FILTER
        ====================================== */

        if (bloodGroup) {

          donors =
            donors.filter(
              donor =>
                donor.bloodGroup ===
                bloodGroup
            );

        }



        /* ======================================
           LOCATION FILTER
        ====================================== */

        if (location) {

          donors =
            donors.filter(donor => {

              const area =
                donor.area
                  ? donor.area.toLowerCase()
                  : "";


              const city =
                donor.city
                  ? donor.city.toLowerCase()
                  : "";


              return (
                area.includes(location) ||
                city.includes(location)
              );

            });

        }



        /* ======================================
           AVAILABILITY FILTER
        ====================================== */

        if (
          availability === "available"
        ) {

          donors =
            donors.filter(
              donor =>
                donor.available === true
            );

        }



        /* ======================================
           EMERGENCY FILTER
        ====================================== */

        if (emergencyOnly) {

          donors =
            donors.filter(
              donor =>
                donor.emergencyAvailable === true
            );

        }



        /* ======================================
           SORT
        ====================================== */

        const sortMode =
          document.getElementById(
            "sortBy"
          ).value;


        donors =
          sortDonors(
            donors,
            sortMode
          );



        /* ======================================
           DISPLAY
        ====================================== */

        renderDonors(donors);

      }


      catch (error) {

        console.error(
          "Error fetching donors:",
          error
        );


        donorResultsEl.innerHTML = `

          <div class="col-12">

            <div class="alert alert-danger">

              Unable to load donors.

              Please make sure the
              LifeConnect backend is running.

            </div>

          </div>

        `;


        resultsCountEl.textContent =
          "Unable to load donors";

      }

    }



    /* ==========================================
       FILTER FORM
    ========================================== */

    document
      .getElementById("filterForm")
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();

          runSearch();

        }
      );



    /* ==========================================
       SORT CHANGE
    ========================================== */

    document
      .getElementById("sortBy")
      .addEventListener(
        "change",
        runSearch
      );



    /* ==========================================
       DONOR MODAL
    ========================================== */

    let activeDonorId = null;


    const donorModalEl =
      document.getElementById(
        "donorModal"
      );


    const donorModal =
      new bootstrap.Modal(
        donorModalEl
      );



    /* ==========================================
       OPEN DONOR MODAL
    ========================================== */

    async function openDonorModal(id) {

      try {

        const response =
          await fetch(
            "http://127.0.0.1:8000/api/donors/"
          );


        if (!response.ok) {

          throw new Error(
            "Failed to load donor"
          );

        }


        const data =
          await response.json();


        const donor =
          (data.donors || []).find(
            item =>
              item.id === id
          );


        if (!donor) {

          return;

        }


        activeDonorId = id;


        document
          .getElementById(
            "donorModalBody"
          )
          .innerHTML = `

            <div
              class="d-flex gap-3 align-items-center mb-3"
            >

              <span
                class="donor-avatar-lc"
                style="
                  width:64px;
                  height:64px;
                  font-size:1.1rem;
                "
              >

                ${initials(donor.name)}

              </span>


              <div>

                <h4 class="mb-1">

                  ${donor.name}

                </h4>


                <span
                  class="badge-lc badge-blood-lc"
                >

                  ${donor.bloodGroup}

                </span>

              </div>

            </div>


            <p class="mb-1">

              <i class="bi bi-geo-alt"></i>

              ${donor.area || "Area not available"},
              ${donor.city || "City not available"}

            </p>


            <p class="mb-1">

              <i class="bi bi-telephone"></i>

              ${donor.phone || "Phone not available"}

            </p>


            <p class="mb-1">

              <i class="bi bi-heart"></i>

              Status:

              ${
                donor.available
                  ? "Available"
                  : "Unavailable"
              }

            </p>


            <p class="mb-0">

              <i
                class="bi bi-lightning-charge"
              ></i>

              Emergency:

              ${
                donor.emergencyAvailable
                  ? "Available"
                  : "Not available"
              }

            </p>

          `;


        donorModal.show();

      }


      catch (error) {

        console.error(
          "Error loading donor profile:",
          error
        );

      }

    }



    /* ==========================================
       BLOOD REQUEST MODAL
    ========================================== */

    let selectedRequestDonor = null;

    const requestModalEl =
      document.getElementById("requestModal");

    const requestModal =
      new bootstrap.Modal(requestModalEl);


    /* ==========================================
       OPEN REQUEST FORM
    ========================================== */

    async function openRequestForm(donorId) {

      try {

        const response =
          await fetch(
            "http://127.0.0.1:8000/api/donors/"
          );

        if (!response.ok) {
          throw new Error("Failed to load donor");
        }

        const data =
          await response.json();

        const donor =
          (data.donors || []).find(
            item =>
              String(item.id) === String(donorId)
          );

        if (!donor) {
          throw new Error("Donor not found");
        }

        selectedRequestDonor = donor;

        document.getElementById("requestDonorInfo").textContent =
          `Requesting ${donor.bloodGroup} blood from ${donor.name}`;

        document.getElementById("requestBloodGroup").value =
          donor.bloodGroup || "";

        document.getElementById("requestCity").value =
          donor.city || "";

        document.getElementById("requestUrgency").value =
          donor.emergencyAvailable ? "Emergency" : "Normal";

        document.getElementById("requesterName").value = "";
        document.getElementById("requestHospital").value = "";
        document.getElementById("requestUnits").value = 1;

        requestModal.show();

      }

      catch (error) {

        console.error(
          "Error loading donor for request:",
          error
        );

        LCUtils.showToast(
          "Request Failed",
          "Unable to load donor details. Please try again.",
          "error"
        );

      }

    }


    /* ==========================================
       SEND BLOOD REQUEST TO FASTAPI
    ========================================== */

    async function sendBloodRequest(requestData) {

      try {

        const response =
          await fetch(
            "http://127.0.0.1:8000/api/requests/",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(requestData)
            }
          );

        if (!response.ok) {
          throw new Error(
            "Failed to create blood request"
          );
        }

        const result =
          await response.json();

        console.log(
          "Blood request created:",
          result
        );

        LCUtils.showToast(
          "Request Sent",
          "Your blood request has been sent successfully.",
          "success"
        );

        return true;

      }

      catch (error) {

        console.error(
          "Error sending blood request:",
          error
        );

        LCUtils.showToast(
          "Request Failed",
          "Unable to send the blood request. Please try again.",
          "error"
        );

        return false;

      }

    }


    /* ==========================================
       REQUEST FORM SUBMISSION
    ========================================== */

    document
      .getElementById("bloodRequestForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          if (!selectedRequestDonor) {
            return;
          }

          const requesterName =
            document
              .getElementById("requesterName")
              .value
              .trim();

          const units =
            Number(
              document.getElementById("requestUnits").value
            );

          const hospital =
            document
              .getElementById("requestHospital")
              .value
              .trim();

          const city =
            document
              .getElementById("requestCity")
              .value
              .trim();

          const urgency =
            document.getElementById("requestUrgency").value;

          if (
            !requesterName ||
            !hospital ||
            !city ||
            !Number.isInteger(units) ||
            units < 1
          ) {

            LCUtils.showToast(
              "Missing Information",
              "Please fill all required fields correctly.",
              "error"
            );

            return;

          }

          const requestData = {
            requesterName: requesterName,
            bloodGroup: selectedRequestDonor.bloodGroup,
            units: units,
            hospital: hospital,
            city: city,
            urgency: urgency,
            donorId: selectedRequestDonor.id
          };

          const submitButton =
            document.getElementById("submitBloodRequest");

          const originalButtonText =
            submitButton.innerHTML;

          submitButton.disabled = true;

          submitButton.innerHTML =
            `<span class="spinner-border spinner-border-sm me-2"></span>Sending...`;

          try {

            const success =
              await sendBloodRequest(requestData);

            if (success) {

              requestModal.hide();

              document
                .getElementById("bloodRequestForm")
                .reset();

              selectedRequestDonor = null;

            }

          }

          finally {

            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonText;

          }

        }
      );


    /* ==========================================
       PROFILE MODAL SEND REQUEST
    ========================================== */

    document
      .getElementById("donorModalSendRequest")
      .addEventListener(
        "click",
        () => {

          donorModal.hide();

          openRequestForm(activeDonorId);

        }
      );


    /* ==========================================
       LOAD DONORS
    ========================================== */

    runSearch();

  </script>

</body>

</html>

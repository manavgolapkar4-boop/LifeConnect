<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — LifeConnect Admin</title>
  <meta name="description" content="LifeConnect demo analytics: blood group distribution and request status." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="lc-admin-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="lc-admin-shell" id="adminShell">
    <aside class="lc-admin-sidebar" id="lc-admin-sidebar-root"></aside>
    <div class="lc-admin-content">
      <header class="lc-admin-topbar" id="lc-admin-topbar-root"></header>
      <main id="main-content" class="lc-admin-main">

        <div class="alert-lc alert-warning-lc mb-4">
          <i class="bi bi-info-circle-fill"></i>
          <div>Charts below are computed from the current demo dataset (see <code>js/mock-data.js</code>) — not real reporting data.</div>
        </div>

        <div class="row gy-4">
          <div class="col-lg-7">
            <div class="card-lc">
              <h4 class="mb-3">Blood Group Distribution (Donors)</h4>
              <canvas id="bloodGroupChart" height="220" role="img" aria-label="Bar chart of registered donors by blood group"></canvas>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card-lc">
              <h4 class="mb-3">Request Status</h4>
              <canvas id="requestStatusChart" height="220" role="img" aria-label="Doughnut chart of blood requests by status"></canvas>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card-lc">
              <h4 class="mb-3">Donor Availability</h4>
              <canvas id="availabilityChart" height="200" role="img" aria-label="Doughnut chart of donor availability"></canvas>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card-lc">
              <h4 class="mb-3">Requests by Urgency</h4>
              <canvas id="urgencyChart" height="200" role="img" aria-label="Bar chart of blood requests by urgency level"></canvas>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    LCAuth.guard("admin", "../../");
    LCNav.mountAdminShell({ base: "../../", active: "reports", pageTitle: "Reports" });

    const CHART_COLORS = ["#B4182F", "#0F2540", "#1E8E5A", "#C97A1F", "#8A1224", "#6B7488", "#C0392B", "#9AA2B1"];

    // Blood group distribution — count donors per group.
    const donors = LCData.getDonors();
    const groups = LCData.getBloodGroups();
    const groupCounts = groups.map(g => donors.filter(d => d.bloodGroup === g).length);

    new Chart(document.getElementById("bloodGroupChart"), {
      type: "bar",
      data: { labels: groups, datasets: [{ label: "Donors", data: groupCounts, backgroundColor: "#B4182F", borderRadius: 6 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    // Request status distribution
    const requests = LCData.getAdminRequests();
    const statuses = ["Searching", "Donor Found", "Accepted", "Completed", "Cancelled"];
    const statusCounts = statuses.map(s => requests.filter(r => r.status === s).length);

    new Chart(document.getElementById("requestStatusChart"), {
      type: "doughnut",
      data: { labels: statuses, datasets: [{ data: statusCounts, backgroundColor: CHART_COLORS }] },
      options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } } }
    });

    // Donor availability
    const availableCount = donors.filter(d => d.available).length;
    new Chart(document.getElementById("availabilityChart"), {
      type: "doughnut",
      data: { labels: ["Available", "Unavailable"], datasets: [{ data: [availableCount, donors.length - availableCount], backgroundColor: ["#1E8E5A", "#9AA2B1"] }] },
      options: { plugins: { legend: { position: "bottom" } } }
    });

    // Requests by urgency
    const urgencyLevels = ["Normal", "Urgent", "Critical"];
    const urgencyCounts = urgencyLevels.map(u => requests.filter(r => r.emergencyLevel === u).length);
    new Chart(document.getElementById("urgencyChart"), {
      type: "bar",
      data: { labels: urgencyLevels, datasets: [{ label: "Requests", data: urgencyCounts, backgroundColor: ["#9AA2B1", "#C97A1F", "#C0392B"], borderRadius: 6 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users — LifeConnect Admin</title>
  <meta name="description" content="Search, filter and manage LifeConnect user accounts." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="lc-admin-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="lc-admin-shell" id="adminShell">
    <aside class="lc-admin-sidebar" id="lc-admin-sidebar-root"></aside>
    <div class="lc-admin-content">
      <header class="lc-admin-topbar" id="lc-admin-topbar-root"></header>
      <main id="main-content" class="lc-admin-main">

        <div class="admin-toolbar-lc">
          <div>
            <label class="form-label-lc" for="uSearch">Search</label>
            <input type="text" class="form-control-lc" id="uSearch" placeholder="Name or email">
          </div>
          <div>
            <label class="form-label-lc" for="uRole">Role</label>
            <select class="form-select-lc" id="uRole">
              <option value="">All roles</option>
              <option value="Donor">Donor</option>
              <option value="Requester">Requester</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div>
            <label class="form-label-lc" for="uStatus">Status</label>
            <select class="form-select-lc" id="uStatus">
              <option value="">All statuses</option>
              <option value="Active">Active</option>
              <option value="Suspended">Suspended</option>
            </select>
          </div>
          <button class="btn-lc btn-primary-lc" id="uSearchBtn"><i class="bi bi-search"></i> Search</button>
        </div>

        <div class="table-responsive-lc">
          <table class="table-lc">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
        <div id="usersEmptyState" class="empty-state-lc d-none">
          <div class="empty-icon-lc"><i class="bi bi-people"></i></div>
          <h4>No users match your filters.</h4>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    LCAuth.guard("admin", "../../");
    LCNav.mountAdminShell({ base: "../../", active: "users", pageTitle: "Manage Users" });

    const tableBody = document.getElementById("usersTableBody");
    const emptyState = document.getElementById("usersEmptyState");

    function renderUsers() {
      const filters = {
        search: document.getElementById("uSearch").value || undefined,
        role: document.getElementById("uRole").value || undefined,
        status: document.getElementById("uStatus").value || undefined
      };
      const users = LCData.getAdminUsers(filters);
      emptyState.classList.toggle("d-none", users.length > 0);

      tableBody.innerHTML = users.map(u => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td><span class="badge-lc badge-inactive-lc">${u.role}</span></td>
          <td>${u.status === "Active" ? '<span class="badge-lc badge-success-lc"><span class="badge-dot-lc"></span> Active</span>' : '<span class="badge-lc badge-danger-lc">Suspended</span>'}</td>
          <td>
            ${u.status === "Active"
              ? `<button class="btn-lc btn-ghost-lc btn-sm-lc" data-suspend="${u.id}">Suspend</button>`
              : `<button class="btn-lc btn-outline-lc btn-sm-lc" data-activate="${u.id}">Activate</button>`}
          </td>
        </tr>`).join("");

      tableBody.querySelectorAll("[data-suspend]").forEach(btn => {
        btn.addEventListener("click", () => setStatus(btn.dataset.suspend, "Suspended"));
      });
      tableBody.querySelectorAll("[data-activate]").forEach(btn => {
        btn.addEventListener("click", () => setStatus(btn.dataset.activate, "Active"));
      });
    }

    async function setStatus(id, status) {
      if (status === "Suspended") {
        const ok = await LCUtils.confirmDialog({
          title: "Suspend this user?",
          message: "They will lose access until reactivated.",
          confirmLabel: "Suspend User",
          variant: "danger"
        });
        if (!ok) return;
      }
      const user = LCData.adminSetUserStatus(id, status);
      renderUsers();
      if (user) LCUtils.showToast(status === "Active" ? "User activated" : "User suspended", `${user.name} is now ${status.toLowerCase()}.`, status === "Active" ? "success" : "warning");
    }

    document.getElementById("uSearchBtn").addEventListener("click", renderUsers);
    document.getElementById("uRole").addEventListener("change", renderUsers);
    document.getElementById("uStatus").addEventListener("change", renderUsers);
    document.getElementById("uSearch").addEventListener("keyup", (e) => { if (e.key === "Enter") renderUsers(); });

    renderUsers();
  </script>
</body>
</html>

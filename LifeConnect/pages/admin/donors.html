<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Donors — LifeConnect Admin</title>
  <meta name="description" content="Search, filter and verify LifeConnect donor profiles." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="lc-admin-body">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="lc-admin-shell" id="adminShell">
    <aside class="lc-admin-sidebar" id="lc-admin-sidebar-root"></aside>
    <div class="lc-admin-content">
      <header class="lc-admin-topbar" id="lc-admin-topbar-root"></header>
      <main id="main-content" class="lc-admin-main">

        <div class="admin-toolbar-lc">
          <div>
            <label class="form-label-lc" for="dSearch">Search</label>
            <input type="text" class="form-control-lc" id="dSearch" placeholder="Name, area or city">
          </div>
          <div>
            <label class="form-label-lc" for="dBloodGroup">Blood group</label>
            <select class="form-select-lc" id="dBloodGroup"><option value="">All groups</option></select>
          </div>
          <div>
            <label class="form-label-lc" for="dVerified">Verification</label>
            <select class="form-select-lc" id="dVerified">
              <option value="">All donors</option>
              <option value="verified">Verified</option>
              <option value="unverified">Pending verification</option>
            </select>
          </div>
          <button class="btn-lc btn-primary-lc" id="dSearchBtn"><i class="bi bi-search"></i> Search</button>
        </div>

        <div class="table-responsive-lc">
          <table class="table-lc">
            <thead>
              <tr><th>Name</th><th>Blood Group</th><th>Location</th><th>Verification</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="donorsTableBody"></tbody>
          </table>
        </div>
        <div id="donorsEmptyState" class="empty-state-lc d-none">
          <div class="empty-icon-lc"><i class="bi bi-droplet"></i></div>
          <h4>No donors match your filters.</h4>
        </div>

      </main>
    </div>
  </div>

  <!-- Donor detail modal -->
  <div class="modal fade" id="donorModal" tabindex="-1" aria-labelledby="donorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="donorModalLabel">Donor details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="donorModalBody"></div>
        <div class="modal-footer"><button type="button" class="btn-lc btn-outline-lc" data-bs-dismiss="modal">Close</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    LCAuth.guard("admin", "../../");
    LCNav.mountAdminShell({ base: "../../", active: "donors", pageTitle: "Manage Donors" });

    const bgSelect = document.getElementById("dBloodGroup");
    LCData.getBloodGroups().forEach(bg => {
      const opt = document.createElement("option");
      opt.value = bg; opt.textContent = bg;
      bgSelect.appendChild(opt);
    });

    // Pre-fill the verification filter if arriving from the dashboard's
    // "Review Now" link (?verified=unverified).
    const params = new URLSearchParams(window.location.search);
    if (params.get("verified")) document.getElementById("dVerified").value = params.get("verified");

    const tableBody = document.getElementById("donorsTableBody");
    const emptyState = document.getElementById("donorsEmptyState");
    const donorModal = new bootstrap.Modal(document.getElementById("donorModal"));

    function renderDonors() {
      const filters = {
        search: document.getElementById("dSearch").value || undefined,
        bloodGroup: bgSelect.value || undefined,
        verified: document.getElementById("dVerified").value || undefined
      };
      const donors = LCData.getAdminDonors(filters);
      emptyState.classList.toggle("d-none", donors.length > 0);

      tableBody.innerHTML = donors.map(d => `
        <tr>
          <td>${d.name}</td>
          <td><span class="badge-lc badge-blood-lc">${d.bloodGroup}</span></td>
          <td>${d.area}, ${d.city}</td>
          <td>${d.verified ? '<span class="badge-lc badge-success-lc"><i class="bi bi-patch-check-fill"></i> Verified</span>' : '<span class="badge-lc badge-warning-lc">Pending</span>'}</td>
          <td>${d.available ? '<span class="badge-lc badge-success-lc"><span class="badge-dot-lc"></span> Available</span>' : '<span class="badge-lc badge-inactive-lc">Unavailable</span>'}</td>
          <td class="d-flex gap-2">
            <button class="btn-lc btn-outline-lc btn-sm-lc" data-view="${d.id}">View</button>
            ${d.verified ? "" : `<button class="btn-lc btn-primary-lc btn-sm-lc" data-verify="${d.id}">Verify</button>`}
          </td>
        </tr>`).join("");

      tableBody.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", () => openDonorModal(btn.dataset.view, donors));
      });
      tableBody.querySelectorAll("[data-verify]").forEach(btn => {
        btn.addEventListener("click", () => verifyDonor(btn.dataset.verify));
      });
    }

    function openDonorModal(id, donors) {
      const d = donors.find(x => x.id === id);
      if (!d) return;
      document.getElementById("donorModalBody").innerHTML = `
        <h4>${d.name}</h4>
        <p class="mb-1"><i class="bi bi-droplet"></i> ${d.bloodGroup}</p>
        <p class="mb-1"><i class="bi bi-geo-alt"></i> ${d.area}, ${d.city}</p>
        <p class="mb-1"><i class="bi bi-telephone"></i> ${d.phone}</p>
        <p class="mb-1"><i class="bi bi-clock-history"></i> Last donation: ${d.lastDonation}</p>
        <p class="mb-0">${d.verified ? '<span class="badge-lc badge-success-lc"><i class="bi bi-patch-check-fill"></i> Verified donor</span>' : '<span class="badge-lc badge-warning-lc">Pending verification</span>'}</p>`;
      donorModal.show();
    }

    async function verifyDonor(id) {
      const ok = await LCUtils.confirmDialog({
        title: "Verify this donor?",
        message: "Verified donors are marked trusted across LifeConnect.",
        confirmLabel: "Verify Donor"
      });
      if (!ok) return;
      const donor = LCData.adminVerifyDonor(id);
      renderDonors();
      if (donor) LCUtils.showToast("Donor verified", `${donor.name} is now a verified donor.`, "success");
    }

    document.getElementById("dSearchBtn").addEventListener("click", renderDonors);
    bgSelect.addEventListener("change", renderDonors);
    document.getElementById("dVerified").addEventListener("change", renderDonors);
    document.getElementById("dSearch").addEventListener("keyup", (e) => { if (e.key === "Enter") renderDonors(); });

    renderDonors();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — LifeConnect</title>
  <meta name="description" content="Your LifeConnect notifications." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="lc-navbar-root"></div>

  <main id="main-content">
    <div class="dash-header-lc">
      <div class="container-lc d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div>
          <h1>Notifications</h1>
          <p class="text-muted-lc mb-0"><span id="unreadCountLabel">0</span> unread notification(s).</p>
        </div>
        <button type="button" class="btn-lc btn-outline-lc" id="markAllReadBtn"><i class="bi bi-check2-all"></i> Mark all as read</button>
      </div>
    </div>

    <section>
      <div class="container-lc" style="max-width:760px;">
        <div class="d-flex flex-column gap-3" id="notificationsList"></div>

        <div id="notifEmptyState" class="empty-state-lc d-none">
          <div class="empty-icon-lc"><i class="bi bi-bell"></i></div>
          <h4>No notifications yet</h4>
          <p class="mb-0">Emergency requests and match alerts will show up here.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="lc-footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    // Phase 3: redirect to login if neither a real donor session nor a Phase 2 demo donor session is active.
    LCAuth.guard("donor", "../../");
    LCNav.mount({ base: "../../", active: "notifications", role: "donor" });

    const TYPE_ICON = {
      emergency: "bi-lightning-charge-fill",
      match: "bi-bullseye",
      accepted: "bi-check-circle-fill",
      profile: "bi-person-check",
      history: "bi-clock-history"
    };

    const listEl = document.getElementById("notificationsList");
    const emptyEl = document.getElementById("notifEmptyState");

    function renderNotifications() {
      const notifications = LCData.getNotifications();
      emptyEl.classList.toggle("d-none", notifications.length > 0);
      document.getElementById("unreadCountLabel").textContent = LCData.getUnreadNotificationCount();

      listEl.innerHTML = notifications.map(n => `
        <div class="notification-item-lc ${n.read ? "" : "unread"}" data-notif-id="${n.id}">
          <span class="notif-icon-lc"><i class="bi ${TYPE_ICON[n.type] || "bi-bell-fill"}"></i></span>
          <div class="flex-fill">
            <div class="notif-title-lc">${n.title}</div>
            <div class="notif-msg-lc">${n.message}</div>
            <div class="notif-time-lc">${n.time}</div>
          </div>
          ${n.read ? "" : `<span class="unread-dot-lc" title="Unread"></span>`}
          ${n.read ? "" : `<button class="btn-lc btn-ghost-lc btn-sm-lc" data-mark-read="${n.id}">Mark as read</button>`}
        </div>`).join("");

      listEl.querySelectorAll("[data-mark-read]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          LCData.markNotificationRead(btn.dataset.markRead);
          renderNotifications();
        });
      });
    }

    document.getElementById("markAllReadBtn").addEventListener("click", () => {
      LCData.markAllNotificationsRead();
      renderNotifications();
      LCUtils.showToast("All caught up", "All notifications were marked as read.", "success");
    });

    renderNotifications();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donation History — LifeConnect</title>
  <meta name="description" content="Your past and scheduled blood donations." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="lc-navbar-root"></div>

  <main id="main-content">
    <div class="dash-header-lc">
      <div class="container-lc">
        <h1>Donation History</h1>
        <p class="text-muted-lc mb-0">A record of your past and scheduled donations.</p>
      </div>
    </div>

    <section>
      <div class="container-lc">

        <div class="filter-panel-lc mb-4">
          <div class="row gy-3 align-items-end">
            <div class="col-md-5">
              <label class="form-label-lc" for="dhSearch">Search</label>
              <input type="text" class="form-control-lc" id="dhSearch" placeholder="Search by hospital or location">
            </div>
            <div class="col-md-3">
              <label class="form-label-lc" for="dhStatus">Status</label>
              <select class="form-select-lc" id="dhStatus">
                <option value="">All statuses</option>
                <option value="Completed">Completed</option>
                <option value="Verified">Verified</option>
                <option value="Scheduled">Scheduled</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label-lc" for="dhSort">Sort by date</label>
              <select class="form-select-lc" id="dhSort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
              </select>
            </div>
            <div class="col-md-1">
              <button class="btn-lc btn-primary-lc btn-block-lc" id="dhSearchBtn" aria-label="Search"><i class="bi bi-search"></i></button>
            </div>
          </div>
        </div>

        <!-- Desktop table -->
        <div class="table-responsive-lc d-none d-md-block">
          <table class="table-lc">
            <thead>
              <tr>
                <th>Date</th>
                <th>Hospital</th>
                <th>Location</th>
                <th>Blood Group</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>

        <!-- Mobile cards -->
        <div class="d-md-none row gy-3" id="historyCards"></div>

        <div id="historyEmptyState" class="empty-state-lc d-none">
          <div class="empty-icon-lc"><i class="bi bi-clock-history"></i></div>
          <h4>No donations match your filters.</h4>
          <p class="mb-0">Try clearing the search or status filter.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="lc-footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/maps.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    // Phase 3: redirect to login if neither a real donor session nor a Phase 2 demo donor session is active.
    LCAuth.guard("donor", "../../");
    LCNav.mount({ base: "../../", active: "donation-history", role: "donor" });

    const STATUS_BADGE = {
      Completed: "badge-success-lc",
      Verified: "badge-blood-lc",
      Scheduled: "badge-warning-lc"
    };

    const tableBody = document.getElementById("historyTableBody");
    const cardsWrap = document.getElementById("historyCards");
    const emptyState = document.getElementById("historyEmptyState");

    function renderHistory(records) {
      const hasResults = records.length > 0;
      emptyState.classList.toggle("d-none", hasResults);

      tableBody.innerHTML = records.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.hospital}</td>
          <td>${r.location}</td>
          <td><span class="badge-lc badge-blood-lc">${r.bloodGroup}</span></td>
          <td><span class="badge-lc ${STATUS_BADGE[r.status] || "badge-inactive-lc"}">${r.status}</span></td>
        </tr>`).join("");

      cardsWrap.innerHTML = records.map(r => `
        <div class="col-12">
          <div class="card-lc">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <strong>${r.date}</strong>
              <span class="badge-lc ${STATUS_BADGE[r.status] || "badge-inactive-lc"}">${r.status}</span>
            </div>
            <div class="hospital-meta-row"><i class="bi bi-hospital"></i> ${r.hospital}</div>
            <div class="hospital-meta-row"><i class="bi bi-geo-alt"></i> ${r.location}</div>
            <div class="hospital-meta-row"><i class="bi bi-droplet"></i> ${r.bloodGroup}</div>
          </div>
        </div>`).join("");
    }

    function runHistorySearch() {
      const filters = {
        search: document.getElementById("dhSearch").value || undefined,
        status: document.getElementById("dhStatus").value || undefined,
        sort: document.getElementById("dhSort").value
      };
      renderHistory(LCData.getDonationHistory(filters));
    }

    document.getElementById("dhSearchBtn").addEventListener("click", runHistorySearch);
    document.getElementById("dhStatus").addEventListener("change", runHistorySearch);
    document.getElementById("dhSort").addEventListener("change", runHistorySearch);
    document.getElementById("dhSearch").addEventListener("keyup", (e) => { if (e.key === "Enter") runHistorySearch(); });

    runHistorySearch();
  </script>
</body>
</html>

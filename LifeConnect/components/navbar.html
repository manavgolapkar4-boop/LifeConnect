<!--
  Reference copy of the LifeConnect navbar markup.

  This file is NOT loaded at runtime (opening the site from disk can't
  reliably `fetch()` a partial without a local server). The real navbar is
  generated by js/navigation.js -> LCNav.mount(), which injects the same
  structure into <div id="lc-navbar-root"></div> on every page. Keep this
  file in sync if you change the structure in navigation.js, so it stays
  useful as a quick visual reference for the team.
-->
<header class="lc-navbar">
  <div class="container-lc">
    <a class="brand-lc" href="index.html">
      <!-- brand mark SVG rendered by navigation.js -->
      <span>LifeConnect</span>
    </a>

    <nav class="lc-nav-links" id="lcNavLinks" aria-label="Primary">
      <a href="index.html" aria-current="page">Home</a>
      <a href="pages/public/find-blood.html">Find Blood</a>
      <a href="pages/public/hospitals.html">Hospitals</a>
      <a href="pages/public/about.html">About</a>
    </nav>

    <div class="lc-nav-actions lc-nav-actions-desktop">
      <a href="pages/public/emergency-request.html" class="btn-lc btn-emergency-lc btn-sm-lc">Emergency Request</a>
      <a href="pages/public/signup.html" class="btn-lc btn-outline-lc btn-sm-lc">Become a Donor</a>
      <a href="pages/public/login.html" class="btn-lc btn-ghost-lc btn-sm-lc">Login</a>
    </div>

    <button class="lc-nav-toggle" id="lcNavToggle" aria-expanded="false" aria-controls="lcNavLinks" aria-label="Toggle navigation menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>
